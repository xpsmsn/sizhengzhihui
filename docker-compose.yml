# 思政智汇 — 部署到 NAS（1Panel + Docker Compose）
# 使用 NAS 上已有的 PostgreSQL，地址与凭据写在 .env 的 DATABASE_URL，不启动内置 PG 容器。
# docker compose up -d --build   → http://<NAS-IP>:3000   管理后台在 /admin
name: sizhengzhihui

x-app: &app
  build:
    context: .
    args:
      # 国内构建用 npmmirror 加速
      NPM_REGISTRY: https://registry.npmmirror.com
  image: sizhengzhihui-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    # 连接串（含用户名密码）放在 .env，本文件不入库任何凭据
    DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - data:/data

services:
  # 迁移建表（不跑 seed，信源后续在后台配或改 sources.json 后再 seed）
  setup:
    <<: *backend
    restart: "no"
    command: ["node", "scripts/migrate.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    stop_grace_period: 210s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  data: {}
